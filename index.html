<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>কুইজ বাংলা </title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>কুইজ বাংলা </h1>
          
        </header>

        <div class="quiz-container">
            <div class="timer">সময়: <span id="time">১০</span> সেকেন্ড</div>
            <div class="question-counter">প্রশ্ন: <span id="current-question">১</span>/১০</div>
            
            <div class="question" id="question"></div>
            
            <div class="options" id="options"></div>
            
            <div class="controls">
                <button id="next-btn" class="next-btn">পরবর্তী প্রশ্ন</button>
            </div>
            
            <div class="score-container">
                <div id="score" class="score">স্কোর: ০</div>
            </div>
        </div>
        <h6>create by subodh paul</h6>
    </div>

    <script src="script.js"></script>
</body>
</html>
